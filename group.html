<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>Find My Buddy – Din gruppe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <h1>Din gruppe</h1>
  </header>

  <main class="screen">
    <section class="card">
      <p><strong>Rolle:</strong> <span id="groupRole"></span></p>
      <p><strong>Gruppekode:</strong> <span id="groupCode"></span></p>
      <p><strong>Kaldenavn:</strong> <span id="groupNick"></span></p>
      <p class="small">Du er anonym udenfor gruppen, og appen forbinder dig til den nærmeste makker.</p>

      <h2>Dine makkere</h2>

      <button id="openArrowBtn" class="btn primary">Find nærmeste makker (pil)</button>
      <button id="openPhotoBtn" class="btn">Billeder</button>
      <button id="leaveGroupBtn" class="btn danger">Forlad gruppe</button>
    </section>
  </main>

  <script src="js/session.js"></script>
  <script src="js/group.js"></script>
</body>
</html>
