<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>Find My Buddy – Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <h1>Find My Buddy</h1>
  </header>

  <main class="screen">
    <section class="card">
      <button id="createBtn" class="btn primary">Opret gruppe (admin)</button>

      <button id="joinBtn" class="btn primary">Join gruppe via invitation</button>

      <p class="small">
        Kun gruppen kan se din live-position, og du kan altid forlade gruppen.
      </p>
    </section>
  </main>

  <script src="js/session.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = fmbGetParams();
      const nick = params.get("nick") || "";

      document.getElementById("createBtn")?.addEventListener("click", () => {
        fmbNavigate("create.html", { nick });
      });

      document.getElementById("joinBtn")?.addEventListener("click", () => {
        fmbNavigate("join.html", { nick });
      });
    });
  </script>
</body>
</html>
