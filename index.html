<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>Find My Buddy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="top-bar">
    <h1>Find My Buddy</h1>
  </header>

  <main class="screen">
    <section class="card">
      <h2>Velkommen</h2>
      <p>Skriv et kaldenavn og tryk Start for at finde dine makkere 🧭</p>

      <label for="nameInput" class="label">Dit kaldenavn</label>
      <input
        id="nameInput"
        type="text"
        placeholder="Fx Stjerneskud"
        maxlength="20"
      />

      <button id="startBtn" class="btn primary">Start</button>

      <p class="small">Ingen konto, ingen datalagring – kun en midlertidig session.</p>
    </section>
  </main>

  <script src="js/session.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const nameInput = document.getElementById("nameInput");
      const startBtn = document.getElementById("startBtn");

      if (!nameInput || !startBtn) return;

      startBtn.addEventListener("click", () => {
        const name = nameInput.value.trim();
        if (!name) {
          alert("Skriv lige et kaldenavn 😊");
          return;
        }

        fmbNavigate("intro.html", { nick: name });
      });
    });
  </script>
</body>
</html>
